model:
  model_name: ThreeBranchesPretrain
  clip_model: "ViT-L/14"
  clip_arch: ./pretrained_clip/ViT-L-14.pt
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  adapter_dim: 64
  adapter_dropout: 0.1
  pair_loss_weight: 1.0
  pair_inference_weight: 1.0
  attr_loss_weight: 1.0
  attr_inference_weight: 1.0
  obj_loss_weight: 1.0
  obj_inference_weight: 1.0

train:
  cuda_device: 0
  seed: 3407
  dataset: ut-zappos
  dataset_path: ./datasets/ut-zap50k
  optimizer: Adam
  scheduler: StepLR
  lr: 0.0005
  weight_decay: 0.00001
  step_size: 5
  gamma: 0.5
  gradient_accumulation_steps: 1
  epochs: 20
  epoch_start: 0
  train_batch_size: 64
  context_length: 8
  attr_dropout: 0.3
  val_metric: AUC
  save_final_model: True
  save_every_n: 100
  save_path: ./logs/CWPC_UTZap
  kl_loss_weight: 0.5

test:
  eval_batch_size: 256
  text_encoder_batch_size: 1024
  text_first: True
  open_world: False
  topk: 1
  threshold_trials: 50
  bias: 0.001

tta:
  tta_function: predict_logits_text_first_with_coast
  load_model: ./checkpoints/ThreeBranchesPretrain_UTZap/test_best.pt
  load_model_path: ./checkpoints/ThreeBranchesPretrain_UTZap
  use_wandb: False
  use_img_cache: True
  cpu_cache: False
  shot_capacity: 3
  alpha: 0
  beta: 7.5
  theta: 1
  text_lr: 0.00001
  image_lr: 0.00001
  eps: 0.001
  wd: 0.001
  entropy_threshold: 1.5
  margin_threshold: 0.3
  routing_temp: 0.8
  distill_weight: 0.3
  use_align_loss: True
  align_loss_weight: 3.5
  use_kl_loss: True
  kl_entropy_threshold: 2.0
  topk_local: 128
  use_local_subspace: False
  use_factored_cache: False
  use_entropy_norm: False
  margin_ema_decay: 0.99
  consistency_topk: 5
